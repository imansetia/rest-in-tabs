<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your profile · Wordwell</title>
  <meta name="description" content="Learn a language in ten minutes a day. Pick a course to start.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../demo.css">
</head>
<body>
  <header>
    <img src="icon.svg" alt="">
    <span class="site">Wordwell</span>
    <a class="crumbs" href="../../">All demo pages</a>
  </header>
  <h1>Create your profile</h1>
  <p>Step 1 of 3. Pick a course, then choose a daily goal. Lessons take about ten minutes.</p>
  <div class="card">
    <label for="course">Course</label>
    <select id="course">
      <option>Portuguese for beginners</option>
      <option>Spanish for beginners</option>
      <option>Japanese for beginners</option>
    </select>
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="name@example.com">
    <label for="password">Password</label>
    <input type="password" id="password">
    <p class="actions"><span class="button muted">Continue</span></p>
  </div>
  <p class="meta">Two more steps after this one: a daily goal and a placement quiz.</p>
  <footer>Demo page for Rest in Tabs. Not a real shop or service.</footer>
</body>
</html>
