<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Graveyard - Rest in Tabs</title>
    <link rel="stylesheet" href="../assets/fonts/fonts.css" />
    <link rel="stylesheet" href="../assets/tokens.css" />
    <link rel="stylesheet" href="../assets/base.css" />
    <link rel="stylesheet" href="./graveyard.css" />
    <link rel="stylesheet" href="./scene.css" />
    <link rel="stylesheet" href="./stone.css" />
    <link rel="stylesheet" href="./plaque.css" />
    <link rel="stylesheet" href="./list.css" />
    <script type="module" src="./graveyard.ts"></script>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <h1>Rest in Tabs</h1>
        <p>Final resting place of tabs that were going to be read later.</p>
      </div>
      <!-- Shown once the statistics have been read, so a failed read never shows false numbers. -->
      <div class="stats" id="stats" role="group" aria-label="Statistics" hidden>
        <span><b id="st-buried"></b> buried</span>
        <span><b id="st-res"></b> resurrected</span>
        <span>≈ <b id="st-ram"></b> freed (estimated)</span>
      </div>
    </header>

    <div class="controls">
      <label class="search">
        <span class="sr-only">Search the graveyard</span>
        <input id="q" type="search" placeholder="Search by title, site or epitaph" autocomplete="off" />
      </label>
      <div class="seg" role="group" aria-label="View">
        <button type="button" id="v-land" aria-pressed="true">Landscape</button>
        <button type="button" id="v-list" aria-pressed="false">List</button>
      </div>
      <div class="seg" role="group" aria-label="Theme">
        <button type="button" id="th-night" aria-pressed="false">Night</button>
        <button type="button" id="th-dusk" aria-pressed="false">Dusk</button>
      </div>
      <span class="spacer"></span>
      <button type="button" class="btn primary" id="bury-idle">Bury idle tabs</button>
    </div>

    <main>
      <section class="scene" id="scene" aria-label="Graveyard, landscape view">
        <div class="stars" aria-hidden="true"></div>
        <div class="moon" aria-hidden="true"></div>
        <svg class="flyer" id="flyer" viewBox="0 0 80 40" aria-hidden="true"><path d="M2 18 C14 7 26 7 36 18 C40 13 44 13 48 18 C58 7 70 7 78 16 C68 16 58 20 50 24 C46 29 40 30 36 26 C28 22 16 18 2 18Z" fill="#04060a"/></svg>
        <svg class="hills" viewBox="0 0 1440 320" preserveAspectRatio="none" aria-hidden="true">
          <path class="far" d="M0 200 C180 140 360 160 520 182 C700 206 820 128 1000 140 C1160 152 1300 196 1440 172 L1440 320 L0 320Z"/>
          <path class="near" d="M0 250 C200 214 380 234 560 244 C760 254 900 208 1080 218 C1240 228 1340 250 1440 240 L1440 320 L0 320Z"/>
        </svg>
        <div class="ground" aria-hidden="true"></div>
        <svg class="tree t3" viewBox="0 0 200 300" aria-hidden="true"><g fill="none" stroke-linecap="round"><path d="M100 300 C98 250 102 210 96 170" stroke-width="14"/><path d="M97 190 C80 160 60 150 40 120" stroke-width="7"/><path d="M99 175 C120 150 140 140 160 112" stroke-width="7"/><path d="M96 170 C96 140 92 112 100 80" stroke-width="6"/></g></svg>
        <svg class="tree t1" viewBox="0 0 200 300" aria-hidden="true"><g fill="none" stroke-linecap="round"><path d="M100 300 C98 250 102 210 96 170" stroke-width="14"/><path d="M97 190 C80 160 60 150 40 120" stroke-width="7"/><path d="M60 148 C50 130 48 112 52 96" stroke-width="4"/><path d="M99 175 C120 150 140 140 160 112" stroke-width="7"/><path d="M140 138 C150 120 168 112 182 108" stroke-width="3.5"/><path d="M96 170 C96 140 92 112 100 80" stroke-width="6"/><path d="M99 110 C112 96 120 80 118 60" stroke-width="3.5"/><path d="M100 96 C88 84 80 70 78 52" stroke-width="3"/><path d="M44 124 C34 118 24 118 14 122" stroke-width="2.5"/><path d="M158 116 C164 100 162 88 156 76" stroke-width="2.5"/><path d="M118 62 C124 52 132 48 140 46" stroke-width="2"/></g></svg>
        <svg class="tree t2" viewBox="0 0 200 300" aria-hidden="true"><g fill="none" stroke-linecap="round"><path d="M100 300 C100 240 96 200 104 150" stroke-width="12"/><path d="M102 200 C84 176 66 168 46 146" stroke-width="6"/><path d="M104 160 C124 136 146 128 168 98" stroke-width="6"/><path d="M104 150 C102 120 108 96 98 70" stroke-width="5"/><path d="M60 158 C52 140 52 126 58 110" stroke-width="3"/><path d="M98 76 C86 66 82 54 84 40" stroke-width="2.5"/></g></svg>

        <div class="fog f-far" aria-hidden="true"></div>
        <div class="fog f-mid" aria-hidden="true"></div>
        <div class="camera" id="camera"></div>
        <div class="fog f-near" aria-hidden="true"></div>

        <svg class="fence" aria-hidden="true" preserveAspectRatio="none">
          <defs>
            <pattern id="bars" width="26" height="58" patternUnits="userSpaceOnUse">
              <rect x="11" y="12" width="4" height="46" fill="#05070b"/>
              <path d="M13 1 L18 12 L8 12Z" fill="#05070b"/>
            </pattern>
          </defs>
          <rect width="100%" height="58" fill="url(#bars)"/>
          <rect y="22" width="100%" height="4" fill="#05070b"/>
          <rect y="48" width="100%" height="10" fill="#05070b"/>
        </svg>
        <svg class="fence-crow" id="fence-crow" viewBox="0 0 60 50" aria-hidden="true"><path d="M8 30 C10 22 18 18 26 19 C30 12 38 10 44 14 L55 13 L46 18 C48 24 46 32 38 36 L40 47 M33 37 L32 47" fill="#04060a" stroke="#04060a" stroke-width="2"/><path d="M8 30 C4 31 2 34 1 38 C6 35 12 34 18 32" fill="#04060a"/><circle cx="42" cy="16" r="1.3" fill="#9aa3b0"/></svg>

        <p class="scene-msg" id="scene-msg" hidden></p>

        <aside class="plaque" id="plaque" aria-labelledby="pl-title" hidden>
          <button type="button" class="close" id="pl-close" aria-label="Close">×</button>
          <h2 id="pl-title"></h2>
          <div class="domain" id="pl-domain"></div>
          <dl>
            <dt>Epitaph</dt><dd class="epitaph" id="pl-epi"></dd>
            <dt>Cause of death</dt><dd id="pl-cause"></dd>
            <dt>Last visited</dt><dd id="pl-visited"></dd>
            <dt>Buried</dt><dd id="pl-buried"></dd>
            <dt>Condition</dt><dd><span class="chip" id="pl-stage"></span></dd>
          </dl>
          <div class="actions">
            <button type="button" class="btn primary" id="pl-res">Resurrect</button>
            <button type="button" class="btn danger" id="pl-exo">Exorcise</button>
          </div>
        </aside>
      </section>

      <section class="list" id="list" aria-label="Graveyard, list view" hidden>
        <div class="list-head">
          <span id="list-count"></span>
          <span class="spacer"></span>
          <label>Sort
            <select id="sort">
              <option value="new">Newest first</option>
              <option value="old">Oldest first</option>
              <option value="name">Name</option>
            </select>
          </label>
        </div>
        <table>
          <thead><tr><th>Tab</th><th>Epitaph</th><th>Cause of death</th><th>Buried</th><th>Condition</th><th><span class="sr-only">Actions</span></th></tr></thead>
          <tbody id="list-body"></tbody>
        </table>
        <p class="empty" id="list-empty" hidden></p>
      </section>
    </main>

    <dialog id="confirm" aria-labelledby="cf-title" aria-describedby="cf-text">
      <h2 id="cf-title">Exorcise this grave?</h2>
      <p id="cf-text"></p>
      <div class="actions">
        <button type="button" class="btn" id="cf-keep">Keep it</button>
        <button type="button" class="btn danger" id="cf-go">Exorcise</button>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
